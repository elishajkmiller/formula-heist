plugins {
    id 'com.android.application' version '8.5.2'
}

android {
    namespace 'com.elishajkmiller.formulaheist'
    compileSdk 35
    defaultConfig {
        applicationId 'com.elishajkmiller.formulaheist'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2'
    }
    sourceSets.main {
        manifest.srcFile 'AndroidManifest.xml'
        java.srcDirs = ['src']
        res.srcDirs = ['res']
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildTypes {
        release { minifyEnabled false }
    }
    lint { abortOnError false }
}
